name: Build & Release

on:
  workflow_dispatch:
    inputs:
      build_web:
        description: Also build the web bundle
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck & doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  android:
    name: Android build (APK + AAB)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.version = version;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          console.log(`Set app version to ${version}`);
          EOF
      - name: Generate native project
        run: npx expo prebuild --platform android --clean
      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" > android/local.properties
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build release artifacts
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  web:
    name: Web bundle
    needs: checks
    if: ${{ inputs.build_web }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Export web bundle
        run: npx expo export --platform web
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: artifacts
      - name: Prepare release asset
        run: |
          set -euo pipefail
          APK=$(find artifacts -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found in artifacts" >&2
            exit 1
          fi
          cp "$APK" "Budgeter-${GITHUB_REF_NAME}.apk"
          ls -lh "Budgeter-${GITHUB_REF_NAME}.apk"
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: Budgeter-${{ github.ref_name }}.apk
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "Budgeter $TAG" \
              --generate-notes \
              --verify-tag \
              --notes "$(cat <<'EOF'
          ## Install on Android

          1. Download the `.apk` file below **on your phone**.
          2. Tap it in your downloads and allow installing from unknown sources when prompted.
          3. Open **Budgeter** from your app drawer.

          New versions install over the top of the old one — no need to uninstall first.
          EOF
          )"
          fi
